<section data-screen-label="Paramètres · Appréciations" style="display:flex;flex-direction:column;gap:16px">

                <span style="padding:5px 10px;border-radius:999px;font-weight:600;background:{{ men.resBg }};color:oklch(20% 0.03 164)">{{ men.res }}</span>
              </div>
            </div>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">
            <div style="flex:1 1 360px;display:flex;flex-direction:column;gap:6px;background:oklch(38% 0.04 164);border:1px solid oklch(50% 0.035 164);border-radius:0.7rem;padding:16px 18px">
              <span style="font-family:'IBM Plex Mono',monospace;font-size:0.7rem;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:oklch(82% 0.08 162)">Distinctions et sanctions de travail (moyenne trimestrielle)</span>
              <sc-for list="{{ men.dist }}" as="d" hint-placeholder-count="5">
                <div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid oklch(44% 0.035 164)">
                  <span style="flex:1;font-size:0.9rem;font-weight:600;color:{{ d.color }}">{{ d.name }}</span>
                  <span style="font:0.9rem 'IBM Plex Mono',monospace;color:oklch(80% 0.02 155)">{{ d.op }}</span>
                  <input value="{{ d.val }}" onChange="{{ d.onChange }}" inputMode="decimal" style="width:74px;height:34px;padding:0 10px;text-align:right;border-radius:0.4rem;font:0.88rem 'IBM Plex Mono',monospace;color:oklch(95% 0.012 150);background:oklch(35% 0.04 164);border:1px solid oklch(50% 0.035 164);outline:none">
                </div>
              </sc-for>
            </div>
            <sc-if value="{{ men.anglo }}" hint-placeholder-val="{{ false }}">
              <div style="flex:1 1 300px;display:flex;flex-direction:column;gap:6px;background:oklch(38% 0.04 164);border:1px solid oklch(50% 0.035 164);border-radius:0.7rem;padding:16px 18px">
                <span style="font-family:'IBM Plex Mono',monospace;font-size:0.7rem;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:oklch(82% 0.08 162)">Grades anglophones · exemple</span>
                <sc-for list="{{ men.grades }}" as="gr" hint-placeholder-count="6">
                  <div style="display:grid;grid-template-columns:36px 110px minmax(0,1fr);gap:10px;padding:6px 0;border-bottom:1px solid oklch(44% 0.035 164);font-size:0.88rem"><b style="font-family:'IBM Plex Mono',monospace">{{ gr.g }}</b><span style="font-family:'IBM Plex Mono',monospace;color:oklch(82% 0.02 155)">{{ gr.r }}</span><span>{{ gr.l }}</span></div>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </section>
